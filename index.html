<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkShort</title>
<script src="https://cdn.jsdelivr.net/npm/tailwindcss-jit-cdn"></script>
<style>
body { background-color: #18191c; color: #fff; font-family: 'Segoe UI', sans-serif; }
.card { background: #202225; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
input { background: #2f3136; border: none; border-radius: .5rem; padding: .75rem; color: #fff; width: 100%; }
button { background: #5865f2; border: none; padding: .6rem 1.2rem; border-radius: .5rem; color: #fff; cursor: pointer; }
button:hover { background: #4752c4; }
.link-card { background:#2f3136; padding:.75rem 1rem; border-radius:.5rem; margin:.5rem 0; }
.link-card small{color:#bbb;}
</style>
</head>
<body class="p-6">

<div class="max-w-2xl mx-auto space-y-6">
  <div class="card space-y-3">
    <h2 class="text-xl font-semibold">Create a new short link</h2>
    <input type="text" id="linkName" placeholder="Link name">
    <input type="text" id="linkUrl" placeholder="Destination URL (example.com)">
    <button id="createBtn">Create Link</button>
    <p id="statusMsg" class="text-sm text-gray-400"></p>
  </div>

  <div class="card">
    <h2 class="text-xl font-semibold mb-2">My Links</h2>
    <div id="linksList"></div>
  </div>
</div>

<script>
let links = JSON.parse(localStorage.getItem('links')||'[]');
const maxLinks = 10;
const list = document.getElementById('linksList');
const msg = document.getElementById('statusMsg');

function updateList(){
  list.innerHTML='';
  if(links.length===0){list.innerHTML='<p class="text-gray-400">No links yet.</p>';return;}
  links.forEach(l=>{
    const div=document.createElement('div');
    div.className='link-card';
    div.innerHTML=`
      <strong>${l.name}</strong><br>
      <small>Short: <a href="?c=${l.code}" class="text-indigo-400">${location.origin}?c=${l.code}</a></small><br>
      <small>Destination: ${l.url}</small><br>
      <small>Views: ${l.views||0}</small><br>
      <button onclick="deleteLink('${l.code}')">Delete</button>
    `;
    list.appendChild(div);
  });
}

document.getElementById('createBtn').onclick = ()=>{
  const name=document.getElementById('linkName').value.trim();
  let url=document.getElementById('linkUrl').value.trim();
  if(!name||!url){msg.textContent='Please fill all fields.';return;}
  if(!url.startsWith('http://')&&!url.startsWith('https://')){
    url='https://'+url;
  }
  if(links.length>=maxLinks){msg.textContent='Max 10 links reached.';return;}
  const code=Math.random().toString(36).substring(2,8);
  links.push({name,url,code,views:0});
  localStorage.setItem('links',JSON.stringify(links));
  msg.textContent='Link created!';
  document.getElementById('linkName').value='';
  document.getElementById('linkUrl').value='';
  updateList();
};

function deleteLink(code){
  links=links.filter(l=>l.code!==code);
  localStorage.setItem('links',JSON.stringify(links));
  updateList();
}

updateList();
</script>
</body>
</html>
