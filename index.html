<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShort • Private Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f3f5f9;
      color: #333;
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      background: #1f2937;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .sidebar h1 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
      color: #00a2ff;
    }

    .sidebar .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
      font-size: 16px;
    }

    .menu-item {
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .menu-item:hover {
      background: #374151;
    }

    /* MAIN AREA */
    .main {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    header h2 {
      color: #1f2937;
      font-size: 24px;
    }

    .link-counter {
      background: #007bff;
      color: #fff;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 14px;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }

    input, button {
      font-size: 15px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin: 6px 0;
      width: 100%;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #005fcc;
    }

    .link-list {
      margin-top: 15px;
    }

    .link-item {
      background: #f9fafb;
      border: 1px solid #e0e0e0;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .link-item a {
      color: #007bff;
      text-decoration: none;
      word-break: break-all;
    }

    .actions {
      margin-top: 10px;
    }

    .actions button {
      margin-right: 6px;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .btn-edit { background: #ffc107; color: #222; }
    .btn-delete { background: #dc3545; color: white; }
    .btn-copy { background: #28a745; color: white; }

    .privacy {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 15px;
    }

    /* REDIRECT PAGE */
    #redirectPage {
      display: none;
      background-color: #202225;
      color: white;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0; left: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #redirectPage h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    #redirectPage p {
      color: #b9bbbe;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h1>LinkShort</h1>
    <div class="menu">
      <div class="menu-item">Dashboard</div>
      <div class="menu-item">My Links</div>
      <div class="menu-item">Settings</div>
      <div class="menu-item">About</div>
    </div>
  </div>

  <div class="main" id="mainPage">
    <header>
      <h2>Dashboard</h2>
      <div class="link-counter" id="linkCounter">Links: 0 / 10</div>
    </header>

    <div class="card">
      <h3>Create a New Short Link</h3>
      <input type="text" id="linkName" placeholder="Name for your link (optional)">
      <input type="text" id="longUrl" placeholder="Enter URL (https://example.com)">
      <button id="shortenBtn">Create Short Link</button>
    </div>

    <div class="card">
      <h3>Your Links</h3>
      <div id="linkList" class="link-list"></div>
    </div>

    <p class="privacy">
      🔒 All links are encrypted and stored locally on your device.  
      No database, no tracking, full privacy.
    </p>
  </div>

  <!-- Redirect Page -->
  <div id="redirectPage">
    <h1>Redirecting...</h1>
    <p>Please wait, you will be redirected shortly.</p>
  </div>

  <script>
    const STORAGE_KEY = "shortLinks";
    const MAX_LINKS = 10;
    let links = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    const listContainer = document.getElementById("linkList");
    const linkCounter = document.getElementById("linkCounter");

    // Encode / Decode
    function encrypt(text) { return btoa(unescape(encodeURIComponent(text))); }
    function decrypt(text) { try { return decodeURIComponent(escape(atob(text))); } catch { return text; } }

    function ensureProtocol(url) {
      url = url.trim();
      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
      }
      return url;
    }

    function saveLinks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
    }

    function updateCounter() {
      const count = Object.keys(links).length;
      linkCounter.textContent = `Links: ${count} / ${MAX_LINKS}`;
    }

    function renderLinks() {
      listContainer.innerHTML = "";
      const keys = Object.keys(links);
      updateCounter();

      if (keys.length === 0) {
        listContainer.innerHTML = "<p>No links created yet.</p>";
        return;
      }

      keys.forEach(code => {
        const link = links[code];
        const shortUrl = `${window.location.origin}${window.location.pathname}?c=${code}`;
        const div = document.createElement("div");
        div.className = "link-item";
        div.innerHTML = `
          <strong>${link.name || code}</strong><br>
          Original: <a href="${decrypt(link.url)}" target="_blank">${decrypt(link.url)}</a><br>
          Short: <a href="${shortUrl}" target="_blank">${shortUrl}</a><br>
          <small>Views: ${link.views}</small>
          <div class="actions">
            <button class="btn-copy" onclick="copyLink('${shortUrl}')">Copy</button>
            <button class="btn-edit" onclick="editLink('${code}')">Edit</button>
            <button class="btn-delete" onclick="deleteLink('${code}')">Delete</button>
          </div>
        `;
        listContainer.appendChild(div);
      });
    }

    function copyLink(link) {
      navigator.clipboard.writeText(link);
      alert("Short link copied to clipboard!");
    }

    function editLink(code) {
      const link = links[code];
      const newName = prompt("Edit link name:", link.name || "");
      const newUrl = prompt("Edit destination URL:", decrypt(link.url));
      if (!newUrl) return;
      links[code].name = newName;
      links[code].url = encrypt(ensureProtocol(newUrl));
      saveLinks();
      renderLinks();
    }

    function deleteLink(code) {
      if (!confirm("Are you sure you want to delete this link?")) return;
      delete links[code];
      saveLinks();
      renderLinks();
    }

    document.getElementById("shortenBtn").addEventListener("click", () => {
      const currentCount = Object.keys(links).length;
      if (currentCount >= MAX_LINKS) {
        alert(`You’ve reached your limit of ${MAX_LINKS} links.`);
        return;
      }

      let url = document.getElementById("longUrl").value;
      const name = document.getElementById("linkName").value.trim();

      if (!url) return alert("Please enter a valid URL.");
      url = ensureProtocol(url);

      const code = Math.random().toString(36).substring(2, 8);
      links[code] = {
        name: name || `Link ${currentCount + 1}`,
        url: encrypt(url),
        views: 0,
        createdAt: new Date().toISOString()
      };

      saveLinks();
      renderLinks();

      document.getElementById("linkName").value = "";
      document.getElementById("longUrl").value = "";
    });

    // Redirect logic
    const params = new URLSearchParams(window.location.search);
    const codeParam = params.get("c");

    if (codeParam) {
      document.body.style.background = "#202225";
      document.querySelector(".sidebar").style.display = "none";
      document.getElementById("mainPage").style.display = "none";
      const redirectPage = document.getElementById("redirectPage");
      redirectPage.style.display = "flex";

      const link = links[codeParam];
      if (link) {
        link.views = (link.views || 0) + 1;
        saveLinks();
        setTimeout(() => {
          window.location.href = decrypt(link.url);
        }, 2000);
      } else {
        redirectPage.innerHTML = "<h2>Link not found</h2><p>This short link does not exist or was deleted.</p>";
      }
    } else {
      renderLinks();
    }
  </script>
</body>
</html>
