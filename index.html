<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enhanced Link Shortener & File Storage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #121212;
    color: #eee;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  h1 {
    font-weight: 600;
    margin-bottom: 1rem;
    color: #61dafb;
  }

  label {
    display: block;
    margin-top: 1.5rem;
    font-weight: 600;
    color: #bbb;
  }

  input[type="text"],
  input[type="file"] {
    width: 100%;
    max-width: 480px;
    background: #222;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    color: #eee;
    font-size: 1rem;
    margin-top: 0.4rem;
    transition: background 0.3s ease;
  }

  input[type="text"]:focus,
  input[type="file"]:focus {
    outline: none;
    background: #333;
  }

  button {
    margin-top: 1rem;
    max-width: 480px;
    width: 100%;
    padding: 14px;
    background: #61dafb;
    color: #121212;
    font-weight: 700;
    font-size: 1.1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.25s ease;
  }

  button:hover {
    background: #21a1f1;
  }

  #waiting {
    margin-top: 3rem;
    font-size: 1.5rem;
    color: #61dafb;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  #countdown {
    font-weight: 700;
    font-size: 3rem;
    margin-top: 0.5rem;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .tabs {
    margin-top: 2rem;
    max-width: 480px;
    width: 100%;
    display: flex;
    border-bottom: 2px solid #333;
  }

  .tab {
    flex-grow: 1;
    text-align: center;
    padding: 12px 0;
    cursor: pointer;
    font-weight: 600;
    color: #bbb;
    border-bottom: 3px solid transparent;
    transition: all 0.3s ease;
    user-select: none;
  }

  .tab.active {
    color: #61dafb;
    border-color: #61dafb;
  }

  .tab-content {
    max-width: 480px;
    width: 100%;
    margin-top: 1rem;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li.item {
    background: #222;
    border-radius: 8px;
    margin-bottom: 0.8rem;
    padding: 12px 16px;
    color: #ccc;
    display: flex;
    flex-direction: column;
    transition: background 0.3s ease;
  }

  li.item:hover {
    background: #333;
  }

  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .item-name {
    font-weight: 700;
    color: #61dafb;
    cursor: pointer;
    user-select: text;
    flex-grow: 1;
  }

  .item-name[contenteditable]:focus {
    outline: 2px solid #61dafb;
    background: #1a1a1a;
    border-radius: 4px;
  }

  .item-link {
    color: #ccc;
    font-size: 0.85rem;
    word-break: break-all;
    margin-top: 4px;
  }

  .item-info {
    font-size: 0.8rem;
    color: #888;
    margin-top: 4px;
  }

  .tab-content {
    max-height: 360px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #61dafb #222;
  }
  .tab-content::-webkit-scrollbar {
    width: 8px;
  }
  .tab-content::-webkit-scrollbar-thumb {
    background-color: #61dafb;
    border-radius: 4px;
  }

</style>
</head>
<body>

<h1>Simple Link Shortener & File Storage</h1>

<label for="inputURL">Enter URL or text:</label>
<input id="inputURL" type="text" placeholder="Paste your URL or any text here" autocomplete="off" />

<button id="btnCreateLink">Create Short Link</button>

<label for="inputFile">Or upload file(s):</label>
<input id="inputFile" type="file" multiple />

<button id="btnUploadFile">Save File(s) & Get Link</button>

<div id="waiting" style="display:none;">
  Redirecting in <span id="countdown">5</span> seconds...
</div>

<div class="tabs">
  <div class="tab active" data-tab="links">Links</div>
  <div class="tab" data-tab="files">Files</div>
</div>

<div class="tab-content" id="linksTab">
  <ul id="linksList"></ul>
</div>

<div class="tab-content" id="filesTab" style="display:none;">
  <ul id="filesList"></ul>
</div>

<script>
  const STORAGE_KEY = 'shortener_links';

  function saveEntry(data) {
    const allEntries = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}');
    const id = 'id_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    allEntries[id] = data;
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(allEntries));
    return id;
  }

  function updateEntryName(id, newName) {
    const allEntries = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}');
    if (allEntries[id]) {
      allEntries[id].customName = newName.trim();
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(allEntries));
    }
  }

  function escapeHTML(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function renderLinks() {
    const listEl = document.getElementById('linksList');
    const allEntries = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}');
    listEl.innerHTML = '';

    const links = Object.entries(allEntries).filter(([_, v]) => v.type === 'text');

    if (links.length === 0) {
      listEl.innerHTML = '<li style="color:#666;">No links created yet.</li>';
      return;
    }

    for (const [id, entry] of links) {
      const li = document.createElement('li');
      li.className = 'item';

      const nameEl = document.createElement('div');
      nameEl.className = 'item-name';
      nameEl.contentEditable = true;
      nameEl.spellcheck = false;
      nameEl.textContent = entry.customName || (entry.content.length > 30 ? entry.content.slice(0, 30) + '...' : entry.content);

      nameEl.addEventListener('blur', () => {
        updateEntryName(id, nameEl.textContent);
      });
      nameEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          nameEl.blur();
        }
      });

      const shortUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      const linkEl = document.createElement('a');
      linkEl.className = 'item-link';
      linkEl.href = shortUrl;
      linkEl.target = '_blank';
      linkEl.rel = 'noopener noreferrer';
      linkEl.textContent = shortUrl;

      const infoEl = document.createElement('div');
      infoEl.className = 'item-info';
      infoEl.textContent = `Original: ${entry.content}`;

      li.appendChild(nameEl);
      li.appendChild(linkEl);
      li.appendChild(infoEl);
      listEl.appendChild(li);
    }
  }

  function renderFiles() {
    const listEl = document.getElementById('filesList');
    const allEntries = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}');
    listEl.innerHTML = '';

    const filesEntries = Object.entries(allEntries).filter(([_, v]) => v.type === 'files');

    if (filesEntries.length === 0) {
      listEl.innerHTML = '<li style="color:#666;">No files uploaded yet.</li>';
      return;
    }

    for (const [id, entry] of filesEntries) {
      const li = document.createElement('li');
      li.className = 'item';

      const nameEl = document.createElement('div');
      nameEl.className = 'item-name';
      nameEl.contentEditable = true;
      nameEl.spellcheck = false;
      nameEl.textContent = entry.customName || 'Uploaded files';

      nameEl.addEventListener('blur', () => {
        updateEntryName(id, nameEl.textContent);
      });
      nameEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          nameEl.blur();
        }
      });

      const shortUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      const linkEl = document.createElement('a');
      linkEl.className = 'item-link';
      linkEl.href = shortUrl;
      linkEl.target = '_blank';
      linkEl.rel = 'noopener noreferrer';
      linkEl.textContent = shortUrl;

      const filesListEl = document.createElement('ul');
      filesListEl.style.marginTop = '0.5rem';
      filesListEl.style.paddingLeft = '1.2rem';

      entry.files.forEach(file => {
        const fLi = document.createElement('li');
        fLi.style.color = '#aaa';
        fLi.innerHTML = `<a href="${file.content}" download="${file.name}" style="color:#61dafb;">${escapeHTML(file.name)}</a> — ${file.type || 'unknown'}, ${(file.size / 1024).toFixed(1)} KB`;
        filesListEl.appendChild(fLi);
      });

      li.appendChild(nameEl);
      li.appendChild(linkEl);
      li.appendChild(filesListEl);
      listEl.appendChild(li);
    }
  }

  function validateAndFormatURL(input) {
    try {
      let url = input.trim();
      if (!url.match(/^https?:\/\//i)) {
        url = 'https://' + url;
      }
      new URL(url);
      return url;
    } catch {
      return null;
    }
  }

  // Tab handling
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      if (tab.dataset.tab === 'links') {
        document.getElementById('linksTab').style.display = 'block';
        document.getElementById('filesTab').style.display = 'none';
      } else {
        document.getElementById('linksTab').style.display = 'none';
        document.getElementById('filesTab').style.display = 'block';
      }
    });
  });

  document.getElementById('btnCreateLink').addEventListener('click', () => {
    const input = document.getElementById('inputURL').value.trim();
    if (!input) {
      alert('Please enter a URL or text.');
      return;
    }

    const formattedUrl = validateAndFormatURL(input);

    if (!formattedUrl) {
      alert('Invalid URL format. Please enter a valid URL or text.');
      return;
    }

    const id = saveEntry({ type: 'text', content: formattedUrl });
    document.getElementById('inputURL').value = '';
    renderLinks();
    switchTab('links');
    alert('Short link created successfully!');
  });

  document.getElementById('btnUploadFile').addEventListener('click', () => {
    const files = document.getElementById('inputFile').files;
    if (!files.length) {
      alert('Please select at least one file.');
      return;
    }

    const readFiles = [];
    let filesProcessed = 0;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const reader = new FileReader();

      reader.onload = e => {
        readFiles.push({
          name: file.name,
          type: file.type,
          size: file.size,
          content: e.target.result
        });
        filesProcessed++;

        if (filesProcessed === files.length) {
          const id = saveEntry({ type: 'files', files: readFiles });
          document.getElementById('inputFile').value = '';
          renderFiles();
          switchTab('files');
          alert('File(s) saved and link created successfully!');
        }
      };

      reader.readAsDataURL(file);
    }
  });

  function switchTab(name) {
    tabs.forEach(t => t.classList.remove('active'));
    tabs.forEach(t => {
      if (t.dataset.tab === name) {
        t.classList.add('active');
      }
    });
    document.getElementById('linksTab').style.display = name === 'links' ? 'block' : 'none';
    document.getElementById('filesTab').style.display = name === 'files' ? 'block' : 'none';
  }

  // Redirect page with countdown if ?id= is present
  function redirectCountdown(url) {
    const waitingEl = document.getElementById('waiting');
    const countdownEl = document.getElementById('countdown');

    let count = 5;
    waitingEl.style.display = 'flex';

    const interval = setInterval(() => {
      count--;
      countdownEl.textContent = count;
      if (count === 0) {
        clearInterval(interval);
        window.location.href = url;
      }
    }, 1000);
  }

  window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (id) {
      const allEntries = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}');
      if (!allEntries[id]) {
        document.body.innerHTML = `<p style="color:#f55; font-weight:bold; text-align:center; margin-top:3rem;">Link not found or expired.</p>`;
        return;
      }

      const entry = allEntries[id];
      if (entry.type === 'text') {
        redirectCountdown(entry.content);
      } else if (entry.type === 'files') {
        let html = `<h2 style="color:#61dafb; text-align:center; margin-top:2rem;">Files stored:</h2><ul style="max-width:600px; margin:1rem auto; padding-left:1rem;">`;
        entry.files.forEach(f => {
          html += `<li style="margin-bottom:0.6rem;">
            <a href="${f.content}" download="${f.name}" style="color:#61dafb;">${f.name}</a> <small style="color:#888;">(${f.type || 'unknown'}, ${(f.size/1024).toFixed(1)} KB)</small>
          </li>`;
        });
        html += `</ul>`;
        document.body.innerHTML = html;
      }
    } else {
      renderLinks();
      renderFiles();
    }
  };
</script>

</body>
</html>
