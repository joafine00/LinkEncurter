<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URL Shortener + Admin Panel</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ApexCharts -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <style>
    body.dark {
      background-color: #0b0b0f;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
  </style>
</head>
<body class="dark">

  <!-- Login Overlay -->
  <div id="overlay" class="flex">
    <div class="bg-gray-900 rounded-xl p-8 w-96 shadow-2xl">
      <h2 class="text-2xl mb-6 font-semibold text-indigo-400">Admin Login</h2>
      <input id="passwordInput" type="password" placeholder="Admin password"
             class="w-full p-3 rounded bg-gray-800 border border-gray-700 focus:outline-indigo-500 text-white mb-4" />
      <button id="loginBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 rounded text-white font-semibold">Login</button>
      <p id="loginError" class="mt-3 text-red-500 hidden">Wrong password.</p>
    </div>
  </div>

  <div id="app" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex justify-between items-center px-8 py-4 bg-gray-900 shadow-lg">
      <h1 class="text-xl font-bold text-indigo-400 cursor-pointer" id="homeBtn">Shortify</h1>
      <nav class="space-x-6">
        <button class="navBtn text-gray-300 hover:text-indigo-400 font-medium" data-page="home">Home</button>
        <button class="navBtn text-gray-300 hover:text-indigo-400 font-medium" data-page="admin" id="adminNavBtn" style="display:none;">Admin Panel</button>
      </nav>
      <button id="logoutBtn" class="text-red-500 font-semibold hidden">Logout</button>
    </header>

    <!-- Main -->
    <main class="flex-grow p-8 max-w-7xl mx-auto w-full">

      <!-- Home -->
      <section id="page-home">
        <h2 class="text-3xl font-semibold mb-6 text-indigo-400">Shorten your link</h2>
        <form id="linkForm" class="flex flex-col max-w-md space-y-4">
          <input id="linkName" type="text" placeholder="Custom short name" required
                 class="p-3 rounded bg-gray-800 border border-gray-700 focus:outline-indigo-500 text-white" />
          <input id="linkUrl" type="url" placeholder="Original URL (https://...)" required
                 class="p-3 rounded bg-gray-800 border border-gray-700 focus:outline-indigo-500 text-white" />
          <button type="submit" 
                  class="py-3 bg-indigo-600 hover:bg-indigo-700 rounded text-white font-semibold transition">Create Link</button>
        </form>

        <h3 class="text-xl font-semibold mt-12 mb-4 text-indigo-400">Created Links</h3>
        <div id="linksList" class="space-y-4"></div>
      </section>

      <!-- Admin -->
      <section id="page-admin" class="hidden">
        <h2 class="text-3xl font-semibold mb-8 text-indigo-400">Admin Dashboard</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
          <div class="bg-gray-800 rounded-xl p-6 text-center shadow-lg">
            <h3 class="text-lg font-semibold mb-2">Total Links</h3>
            <p id="totalLinks" class="text-4xl font-bold text-indigo-400">0</p>
          </div>
          <div class="bg-gray-800 rounded-xl p-6 text-center shadow-lg">
            <h3 class="text-lg font-semibold mb-2">Total Views</h3>
            <p id="totalViews" class="text-4xl font-bold text-indigo-400">0</p>
          </div>
          <div class="bg-gray-800 rounded-xl p-6 text-center shadow-lg">
            <h3 class="text-lg font-semibold mb-2">Suspicious Attempts</h3>
            <p id="totalSuspicious" class="text-4xl font-bold text-indigo-400">0</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
          <div>
            <h4 class="text-lg font-semibold mb-4">Links Created</h4>
            <div id="chartLinks"></div>
          </div>
          <div>
            <h4 class="text-lg font-semibold mb-4">Views per Link</h4>
            <div id="chartViews"></div>
          </div>
          <div>
            <h4 class="text-lg font-semibold mb-4">Suspicious Attempts</h4>
            <div id="chartSuspicious"></div>
          </div>
        </div>

        <h3 class="text-2xl font-semibold mb-4 text-indigo-400">Suspicious Activity Log</h3>
        <div class="overflow-auto max-h-64 rounded border border-gray-700 bg-gray-900">
          <table class="min-w-full text-left text-sm text-gray-300">
            <thead class="border-b border-gray-700 bg-gray-800 sticky top-0">
              <tr>
                <th class="p-3">Date / Time</th>
                <th class="p-3">Link</th>
                <th class="p-3">User Agent</th>
              </tr>
            </thead>
            <tbody id="suspiciousLog"></tbody>
          </table>
        </div>
      </section>

      <!-- Redirect overlay -->
      <div id="redirectOverlay" class="fixed inset-0 bg-black bg-opacity-90 flex flex-col justify-center items-center text-center p-6 text-white z-50 hidden">
        <p id="redirectMsg" class="text-2xl mb-6"></p>
        <div class="w-64 h-4 bg-gray-700 rounded overflow-hidden mb-6">
          <div id="progressBar" class="h-full bg-indigo-500 w-0 transition-all"></div>
        </div>
        <button id="cancelRedirectBtn" class="px-6 py-2 bg-red-600 hover:bg-red-700 rounded font-semibold">Cancel</button>
      </div>

    </main>
  </div>

<script>
(() => {
  const ADMIN_PASS = "admin123"; 
  const MAX_LINKS = 50;
  const REDIRECT_DELAY = 5000;

  const overlay = document.getElementById('overlay');
  const loginBtn = document.getElementById('loginBtn');
  const passwordInput = document.getElementById('passwordInput');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');
  const adminNavBtn = document.getElementById('adminNavBtn');
  const navBtns = document.querySelectorAll('.navBtn');
  const pageHome = document.getElementById('page-home');
  const pageAdmin = document.getElementById('page-admin');
  const linkForm = document.getElementById('linkForm');
  const linkNameInput = document.getElementById('linkName');
  const linkUrlInput = document.getElementById('linkUrl');
  const linksList = document.getElementById('linksList');
  const totalLinksEl = document.getElementById('totalLinks');
  const totalViewsEl = document.getElementById('totalViews');
  const totalSuspiciousEl = document.getElementById('totalSuspicious');
  const suspiciousLog = document.getElementById('suspiciousLog');
  const redirectOverlay = document.getElementById('redirectOverlay');
  const redirectMsg = document.getElementById('redirectMsg');
  const progressBar = document.getElementById('progressBar');
  const cancelRedirectBtn = document.getElementById('cancelRedirectBtn');

  let data = JSON.parse(localStorage.getItem('shortifyData') || '{"links":[],"suspicious":[] }');

  const save = () => localStorage.setItem('shortifyData', JSON.stringify(data));

  const renderLinks = () => {
    linksList.innerHTML = '';
    if (data.links.length === 0) {
      linksList.innerHTML = `<p class="text-gray-500">No links created yet.</p>`;
      return;
    }
    data.links.forEach(link => {
      const div = document.createElement('div');
      div.className = 'bg-gray-800 rounded p-4 flex justify-between items-center shadow';
      div.innerHTML = `
        <div>
          <p><strong>${link.name}</strong> → 
            <a href="#" class="text-indigo-400 underline" data-name="${link.name}">${link.url}</a>
          </p>
          <p class="text-gray-400 text-sm">Views: ${link.views}</p>
        </div>
        <button class="deleteBtn bg-red-600 hover:bg-red-700 text-white rounded px-3 py-1" data-name="${link.name}">X</button>
      `;
      linksList.appendChild(div);
    });
  };

  const updateStats = () => {
    totalLinksEl.textContent = data.links.length;
    totalViewsEl.textContent = data.links.reduce((a,b)=>a+b.views,0);
    totalSuspiciousEl.textContent = data.suspicious.length;
  };

  const renderSuspiciousLog = () => {
    suspiciousLog.innerHTML = data.suspicious.map(s =>
      `<tr class="border-b border-gray-800"><td class="p-3">${s.time}</td><td class="p-3">${s.link}</td><td class="p-3">${s.ua}</td></tr>`
    ).join('');
  };

  const renderCharts = () => {
    const chart1 = new ApexCharts(document.querySelector("#chartLinks"), {
      series: [{ name: "Links", data: data.links.map(l => 1) }],
      chart: { type: 'bar', height: 200, foreColor: '#ccc', toolbar: { show: false }},
      xaxis: { categories: data.links.map(l => l.name) },
      colors: ['#6366f1']
    });
    const chart2 = new ApexCharts(document.querySelector("#chartViews"), {
      series: [{ name: "Views", data: data.links.map(l => l.views) }],
      chart: { type: 'line', height: 200, foreColor: '#ccc', toolbar: { show: false }},
      xaxis: { categories: data.links.map(l => l.name) },
      colors: ['#10b981']
    });
    const chart3 = new ApexCharts(document.querySelector("#chartSuspicious"), {
      series: [{ name: "Suspicious", data: [data.suspicious.length] }],
      chart: { type: 'radialBar', height: 200, foreColor: '#ccc' },
      colors: ['#ef4444']
    });
    chart1.render(); chart2.render(); chart3.render();
  };

  const redirect = (link) => {
    redirectOverlay.style.display = 'flex';
    redirectMsg.textContent = `Redirecting to ${link.url}...`;
    progressBar.style.width = '0%';
    let width = 0;
    const interval = setInterval(() => {
      width += 100 / (REDIRECT_DELAY / 100);
      progressBar.style.width = width + '%';
      if (width >= 100) {
        clearInterval(interval);
        redirectOverlay.style.display = 'none';
        link.views++;
        save();
        renderLinks();
        window.open(link.url, '_blank');
      }
    }, 100);
    cancelRedirectBtn.onclick = () => {
      clearInterval(interval);
      redirectOverlay.style.display = 'none';
      data.suspicious.push({ time: new Date().toLocaleString(), link: link.name, ua: navigator.userAgent });
      save();
      updateStats();
      renderSuspiciousLog();
    };
  };

  linkForm.addEventListener('submit', e => {
    e.preventDefault();
    const name = linkNameInput.value.trim();
    const url = linkUrlInput.value.trim();
    if (!name || !url.startsWith('http')) return alert('Invalid data');
    if (data.links.find(l => l.name === name)) return alert('Name already used');
    if (data.links.length >= MAX_LINKS) return alert('Limit reached');
    data.links.push({ name, url, views: 0 });
    save();
    renderLinks(); updateStats();
    linkForm.reset();
  });

  linksList.addEventListener('click', e => {
    if (e.target.matches('a[data-name]')) {
      const link = data.links.find(l => l.name === e.target.dataset.name);
      redirect(link);
    }
    if (e.target.matches('.deleteBtn')) {
      data.links = data.links.filter(l => l.name !== e.target.dataset.name);
      save(); renderLinks(); updateStats();
    }
  });

  navBtns.forEach(btn => btn.onclick = () => {
    const page = btn.dataset.page;
    if (page === 'home') {
      pageHome.style.display = 'block'; pageAdmin.style.display = 'none';
    } else {
      pageHome.style.display = 'none'; pageAdmin.style.display = 'block';
      updateStats(); renderSuspiciousLog(); renderCharts();
    }
  });

  loginBtn.onclick = () => {
    if (passwordInput.value === ADMIN_PASS) {
      localStorage.setItem('adminLogged', 'true');
      overlay.style.display = 'none';
      adminNavBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'inline-block';
    } else loginError.classList.remove('hidden');
  };
  logoutBtn.onclick = () => { localStorage.removeItem('adminLogged'); location.reload(); };

  if (localStorage.getItem('adminLogged') === 'true') {
    overlay.style.display = 'none';
    adminNavBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'inline-block';
  } else overlay.style.display = 'flex';

  renderLinks();
})();
</script>
</body>
</html>
