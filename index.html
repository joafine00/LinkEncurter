<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Customization</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #202225;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* LOADING SCREEN */
    #loadingScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-color: #202225;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s ease;
    }

    .pixel-art {
      display: grid;
      grid-template-columns: repeat(20, 10px);
      grid-template-rows: repeat(20, 10px);
      gap: 1px;
    }

    .pixel {
      width: 10px;
      height: 10px;
      background-color: transparent;
    }

    .discord-blue { background-color: #5865F2; }
    .white { background-color: #FFFFFF; }

    .loading-text {
      margin-top: 20px;
      font-size: 18px;
      color: #99aab5;
      letter-spacing: 1px;
    }

    /* MAIN PAGE (hidden until loaded) */
    #mainPage {
      display: none;
      height: 100%;
      width: 100%;
      background: #2f3136;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 28px;
      color: #FFFFFF;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      color: #b9bbbe;
      margin-bottom: 20px;
    }

    button {
      background-color: #5865F2;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #4752c4;
    }
  </style>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loadingScreen">
    <div class="pixel-art" id="discordLogo"></div>
    <div class="loading-text">Loading...</div>
  </div>

  <!-- MAIN CUSTOMIZATION PAGE -->
  <div id="mainPage">
    <h1>Welcome to Your Customization Page</h1>
    <p>Here you can set up your profile, appearance, and preferences.</p>
    <button>Start Customizing</button>
  </div>

  <script>
    // Create pixel logo dynamically
    const pattern = [
      "0000001111111111000000",
      "0001111111111111110000",
      "0011111111111111111000",
      "0111111111111111111100",
      "0111111000000001111100",
      "1111110000000000111110",
      "1111100000000000011110",
      "1111000011111100001110",
      "1110001111111111000110",
      "1110011110001111100110",
      "1110111000000011101110",
      "0111110000000001111100",
      "0111111000000001111100",
      "0011111110000111111000",
      "0001111111111111110000",
      "0000111111111111100000",
      "0000011111111111000000",
      "0000001111111110000000",
      "0000000111111100000000",
      "0000000000000000000000",
    ];

    const container = document.getElementById("discordLogo");

    pattern.forEach(row => {
      for (let pixel of row) {
        const div = document.createElement("div");
        div.classList.add("pixel");
        if (pixel === "1") div.classList.add("discord-blue");
        if (pixel === "2") div.classList.add("white");
        container.appendChild(div);
      }
    });

    // Simulate loading (e.g. preparing customization page)
    setTimeout(() => {
      document.getElementById("loadingScreen").style.opacity = 0;
      setTimeout(() => {
        document.getElementById("loadingScreen").style.display = "none";
        document.getElementById("mainPage").style.display = "flex";
      }, 800);
    }, 2000); // 2 seconds loading
  </script>

</body>
</html>
