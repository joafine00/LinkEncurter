<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Shortener 🔐</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      color: #222;
    }
    header {
      background: linear-gradient(135deg, #007bff, #00a2ff);
      color: white;
      padding: 1.5rem;
      text-align: center;
    }
    main {
      max-width: 850px;
      margin: 30px auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
      padding: 25px;
    }
    h1 { margin-top: 0; }
    input, button {
      font-size: 15px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin: 5px 0;
      width: 100%;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    .section-title {
      margin-top: 25px;
      border-bottom: 2px solid #007bff;
      padding-bottom: 5px;
    }
    .link-list {
      margin-top: 15px;
    }
    .link-item {
      background: #f9fafb;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
    }
    .link-item a {
      color: #007bff;
      text-decoration: none;
    }
    .actions {
      margin-top: 8px;
    }
    .actions button {
      margin-right: 6px;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .btn-edit { background: #ffc107; color: #222; }
    .btn-delete { background: #dc3545; }
    .btn-copy { background: #28a745; }
    .redirect-page {
      text-align: center;
      padding: 60px;
    }
    .privacy {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Link Shortener 🔐</h1>
    <p>Private and encrypted — your data stays entirely on your device.</p>
  </header>

  <main id="mainContent">
    <div id="homePage">
      <h2>Create a New Short Link</h2>
      <input type="text" id="linkName" placeholder="Name for your link (optional)">
      <input type="url" id="longUrl" placeholder="Enter the full URL (e.g. https://example.com)">
      <button id="shortenBtn">Create Short Link</button>

      <h3 class="section-title">My Links</h3>
      <div id="linkList" class="link-list"></div>
      <p class="privacy">
        All data is stored securely on your device.<br>
        End-to-end encrypted and completely private.
      </p>
    </div>

    <div id="redirectPage" class="redirect-page" style="display:none;">
      <h2>Redirecting securely...</h2>
      <p>This link is encrypted and private. Counting your visit...</p>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "shortLinks";
    let links = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    const listContainer = document.getElementById("linkList");
    const redirectPage = document.getElementById("redirectPage");
    const homePage = document.getElementById("homePage");

    // Simple base64 "encryption"
    function encrypt(text) {
      return btoa(unescape(encodeURIComponent(text)));
    }
    function decrypt(text) {
      try { return decodeURIComponent(escape(atob(text))); } catch { return text; }
    }

    // Automatically ensures URL has a protocol
    function ensureProtocol(url) {
      if (!/^https?:\/\//i.test(url)) {
        return "https://" + url;
      }
      return url;
    }

    function saveLinks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
    }

    function generateCode() {
      return Math.random().toString(36).substring(2, 8);
    }

    function renderLinks() {
      listContainer.innerHTML = "";
      const keys = Object.keys(links);
      if (keys.length === 0) {
        listContainer.innerHTML = "<p>No links created yet.</p>";
        return;
      }

      keys.forEach(code => {
        const link = links[code];
        const shortUrl = `${window.location.origin}${window.location.pathname}?c=${code}`;
        const div = document.createElement("div");
        div.className = "link-item";
        div.innerHTML = `
          <strong>${link.name || code}</strong><br>
          Original: <a href="${decrypt(link.url)}" target="_blank">${decrypt(link.url)}</a><br>
          Short: <a href="${shortUrl}">${shortUrl}</a><br>
          <small>Views: ${link.views}</small>
          <div class="actions">
            <button class="btn-copy" onclick="copyToClipboard('${shortUrl}')">Copy</button>
            <button class="btn-edit" onclick="editLink('${code}')">Edit</button>
            <button class="btn-delete" onclick="deleteLink('${code}')">Delete</button>
          </div>
        `;
        listContainer.appendChild(div);
      });
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text);
      alert("Short link copied!");
    }

    function editLink(code) {
      const link = links[code];
      const newName = prompt("Edit name:", link.name || "");
      const newUrl = prompt("Edit URL:", decrypt(link.url));
      if (newUrl && newUrl.trim() !== "") {
        link.name = newName;
        link.url = encrypt(ensureProtocol(newUrl.trim())); // ensures https://
        saveLinks();
        renderLinks();
      }
    }

    function deleteLink(code) {
      if (confirm("Are you sure you want to delete this link?")) {
        delete links[code];
        saveLinks();
        renderLinks();
      }
    }

    document.getElementById("shortenBtn").addEventListener("click", () => {
      let url = document.getElementById("longUrl").value.trim();
      const name = document.getElementById("linkName").value.trim();
      if (!url) return alert("Please enter a valid URL!");
      url = ensureProtocol(url); // auto-add https:// if missing
      const code = generateCode();
      links[code] = {
        name: name || `Link ${Object.keys(links).length + 1}`,
        url: encrypt(url),
        views: 0,
        createdAt: new Date().toISOString()
      };
      saveLinks();
      renderLinks();
      document.getElementById("longUrl").value = "";
      document.getElementById("linkName").value = "";
    });

    // Redirect mode
    const params = new URLSearchParams(window.location.search);
    const codeParam = params.get("c");

    if (codeParam) {
      const link = links[codeParam];
      if (link) {
        homePage.style.display = "none";
        redirectPage.style.display = "block";
        link.views = (link.views || 0) + 1;
        saveLinks();
        setTimeout(() => {
          window.location.href = decrypt(link.url);
        }, 1500);
      } else {
        document.body.innerHTML = `<div class='redirect-page'><h2>Link not found</h2><p>This short link does not exist or was deleted.</p></div>`;
      }
    } else {
      renderLinks();
    }
  </script>
</body>
</html>
