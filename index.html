<script>
  const STORAGE_KEY = "shortLinks";
  let links = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  const listContainer = document.getElementById("linkList");
  const redirectPage = document.getElementById("redirectPage");
  const homePage = document.getElementById("homePage");

  function encrypt(text) {
    return btoa(unescape(encodeURIComponent(text)));
  }
  function decrypt(text) {
    try { return decodeURIComponent(escape(atob(text))); } catch { return text; }
  }
  function saveLinks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
  }
  function generateCode() {
    return Math.random().toString(36).substring(2, 8);
  }

  function ensureProtocol(url) {
    // Se o link não começar com http:// ou https://, adiciona https://
    if (!/^https?:\/\//i.test(url)) {
      return "https://" + url;
    }
    return url;
  }

  function renderLinks() {
    listContainer.innerHTML = "";
    const keys = Object.keys(links);
    if (keys.length === 0) {
      listContainer.innerHTML = "<p>No links created yet.</p>";
      return;
    }

    keys.forEach(code => {
      const link = links[code];
      const shortUrl = `${window.location.origin}${window.location.pathname}?c=${code}`;
      const div = document.createElement("div");
      div.className = "link-item";
      div.innerHTML = `
        <strong>${link.name || code}</strong><br>
        Original: <a href="${decrypt(link.url)}" target="_blank">${decrypt(link.url)}</a><br>
        Short: <a href="${shortUrl}">${shortUrl}</a><br>
        <small>Views: ${link.views}</small>
        <div class="actions">
          <button class="btn-copy" onclick="copyToClipboard('${shortUrl}')">Copy</button>
          <button class="btn-edit" onclick="editLink('${code}')">Edit</button>
          <button class="btn-delete" onclick="deleteLink('${code}')">Delete</button>
        </div>
      `;
      listContainer.appendChild(div);
    });
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text);
    alert("Short link copied!");
  }

  function editLink(code) {
    const link = links[code];
    const newName = prompt("Edit name:", link.name || "");
    const newUrl = prompt("Edit URL:", decrypt(link.url));
    if (newUrl && newUrl.trim() !== "") {
      link.name = newName;
      link.url = encrypt(ensureProtocol(newUrl.trim())); // ✅ garante o https
      saveLinks();
      renderLinks();
    }
  }

  function deleteLink(code) {
    if (confirm("Are you sure you want to delete this link?")) {
      delete links[code];
      saveLinks();
      renderLinks();
    }
  }

  document.getElementById("shortenBtn").addEventListener("click", () => {
    let url = document.getElementById("longUrl").value.trim();
    const name = document.getElementById("linkName").value.trim();
    if (!url) return alert("Please enter a valid URL!");
    url = ensureProtocol(url); // ✅ adiciona https:// se precisar
    const code = generateCode();
    links[code] = {
      name: name || `Link ${Object.keys(links).length + 1}`,
      url: encrypt(url),
      views: 0,
      createdAt: new Date().toISOString()
    };
    saveLinks();
    renderLinks();
    document.getElementById("longUrl").value = "";
    document.getElementById("linkName").value = "";
  });

  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get("c");

  if (codeParam) {
    const link = links[codeParam];
    if (link) {
      homePage.style.display = "none";
      redirectPage.style.display = "block";

      link.views = (link.views || 0) + 1;
      saveLinks();

      setTimeout(() => {
        window.location.href = decrypt(link.url);
      }, 1500);
    } else {
      document.body.innerHTML = `<div class='redirect-page'><h2>Link not found</h2><p>This short link does not exist or was deleted.</p></div>`;
    }
  } else {
    renderLinks();
  }
</script>
