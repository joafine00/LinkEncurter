<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Link Curto & Upload Local</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
  input, button { padding: 0.5rem; font-size: 1rem; margin: 0.5rem 0; width: 100%; }
  #waiting { display: none; font-size: 1.2rem; margin-top: 2rem; text-align: center; }
  #linksList { margin-top: 1rem; }
</style>
</head>
<body>

<h1>Link Curto & Upload Local</h1>

<!-- Criar Link Curto -->
<label for="inputURL">Cole o link ou texto:</label>
<input id="inputURL" placeholder="Cole o link ou texto aqui" />
<button id="btnCreateLink">Criar Link Curto</button>

<!-- Upload arquivo -->
<label for="inputFile">Ou faça upload de arquivo:</label>
<input type="file" id="inputFile" multiple />
<button id="btnUploadFile">Salvar Arquivo(s)</button>

<div id="waiting">Aguarde <span id="countdown">5</span> segundos...</div>

<h2>Links Criados:</h2>
<ul id="linksList"></ul>

<script>
const LS_KEY = 'local_short_links';

// Função para salvar link/arquivo no localStorage
function saveLink(data) {
  let allLinks = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  // Criar ID simples (timestamp + aleatório)
  let id = 'link_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  allLinks[id] = data;
  localStorage.setItem(LS_KEY, JSON.stringify(allLinks));
  return id;
}

// Função para mostrar links criados na tela
function renderLinks() {
  let allLinks = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  const ul = document.getElementById('linksList');
  ul.innerHTML = '';
  for(let id in allLinks){
    let li = document.createElement('li');
    li.innerHTML = `<a href="?id=${id}" target="_blank">${id}</a> (${allLinks[id].type})`;
    ul.appendChild(li);
  }
}

// Quando clicar em criar link curto
document.getElementById('btnCreateLink').onclick = () => {
  let url = document.getElementById('inputURL').value.trim();
  if(!url){
    alert('Coloque um link ou texto válido!');
    return;
  }
  let data = {type: 'text', content: url};
  let id = saveLink(data);
  alert('Link criado: ' + window.location.origin + window.location.pathname + '?id=' + id);
  renderLinks();
  document.getElementById('inputURL').value = '';
};

// Quando clicar em upload de arquivo
document.getElementById('btnUploadFile').onclick = () => {
  let inputFile = document.getElementById('inputFile');
  if(inputFile.files.length === 0){
    alert('Selecione pelo menos um arquivo.');
    return;
  }
  let filesData = [];
  let promises = [];

  for(let file of inputFile.files){
    let p = new Promise((resolve) => {
      let reader = new FileReader();
      reader.onload = () => {
        // Guardar base64 do arquivo
        filesData.push({
          name: file.name,
          type: file.type,
          size: file.size,
          content: reader.result
        });
        resolve();
      };
      reader.readAsDataURL(file);
    });
    promises.push(p);
  }

  Promise.all(promises).then(() => {
    try {
      let data = {type: 'files', files: filesData};
      let id = saveLink(data);
      alert('Arquivo(s) salvo(s)! Link: ' + window.location.origin + window.location.pathname + '?id=' + id);
      renderLinks();
      inputFile.value = '';
    } catch(e) {
      alert('Erro ao salvar arquivos. Talvez excedeu o limite do localStorage.');
    }
  });
};

// Tela de espera e redirecionamento
function handleRedirect(id) {
  let allLinks = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  if(!allLinks[id]){
    document.body.innerHTML = '<h2>Link não encontrado.</h2>';
    return;
  }
  let countdownEl = document.getElementById('countdown');
  let waitingEl = document.getElementById('waiting');
  waitingEl.style.display = 'block';

  let count = 5;
  let interval = setInterval(() => {
    count--;
    countdownEl.textContent = count;
    if(count === 0){
      clearInterval(interval);
      // Agora redireciona ou mostra conteúdo
      let data = allLinks[id];
      if(data.type === 'text'){
        // Redireciona para link se começar com http/https
        if(data.content.startsWith('http://') || data.content.startsWith('https://')){
          window.location.href = data.content;
        } else {
          // Só mostra o texto
          document.body.innerHTML = `<h2>Conteúdo:</h2><pre>${data.content}</pre>`;
        }
      } else if(data.type === 'files'){
        // Mostrar links para baixar os arquivos
        let html = '<h2>Arquivos:</h2><ul>';
        for(let f of data.files){
          html += `<li><a href="${f.content}" download="${f.name}">${f.name} (${(f.size/1024).toFixed(1)} KB)</a></li>`;
        }
        html += '</ul>';
        document.body.innerHTML = html;
      }
    }
  }, 1000);
}

function getQueryParam(param) {
  let urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}

window.onload = () => {
  renderLinks();
  let id = getQueryParam('id');
  if(id){
    // Se tem ?id= na URL, inicia a espera e depois mostra ou redireciona
    document.body.innerHTML = '<div id="waiting">Aguarde <span id="countdown">5</span> segundos...</div>';
    handleRedirect(id);
  }
};
</script>

</body>
</html>
